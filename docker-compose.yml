services:
  agent:
    build: .
    env_file: .env
    ports: ["8150:8150"]
    depends_on: [postgres,redis]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cua
      POSTGRES_USER: cua
      POSTGRES_PASSWORD: cua
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redisdata:/data"]
volumes: {pgdata: {}, redisdata: {}}
